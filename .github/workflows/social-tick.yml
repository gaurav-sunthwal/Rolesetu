# Wakes the API so scheduled social posts go out on time, and their numbers are read.
#
# Render's free plan puts the API to sleep when nobody uses it, and a sleeping API
# cannot post at 8 pm. This calls it once an hour while people in India are awake.
# Not every few minutes: every wake-up also wakes the database, and Neon's free plan
# counts the hours it is awake.
#
# Needs two repository settings (Settings → Secrets and variables → Actions):
#   secret   CRON_SECRET  the same value as CRON_SECRET on Render
#   variable API_URL      optional; defaults to https://rolesetu.vercel.app
name: social-tick

on:
  schedule:
    # Every hour on the hour from 08:00 to 23:00 India time (UTC+5:30 → :30 UTC).
    - cron: "30 2-17 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and post what is due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.API_URL || 'https://rolesetu.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository; nothing to do."
            exit 0
          fi
          # A sleeping API takes up to a minute to start; retry while it wakes.
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 90 -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_URL/api/v1/internal/social/tick"
