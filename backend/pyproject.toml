[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav Sunthwal", email = "codewithgaurav22005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.111",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.0",
    "fastembed>=0.9.0",
    "firebase-admin>=7.7.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pikepdf>=10.17.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.1.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.111",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/backend/db/migrations/versions"]

[tool.ruff.lint.per-file-ignores]
# A data table: one skill per line reads better than wrapped lines.
"src/backend/modules/matches/local/catalog_data.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends(...) as a default arg is FastAPI's documented pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

# PyMuPDF ships without type hints on most of its functions.
[[tool.mypy.overrides]]
module = [
    "backend.modules.tailoring.pdf.*",
    "backend.modules.tailoring.service",
    "backend.tests.test_resume_editing",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pdfplumber.*", "pdfminer.*", "fastembed.*", "pymupdf.*", "pikepdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the async engine's pool is bound to the loop it was created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
